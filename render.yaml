services:
  - type: web
    plan: free
    name: msouwout-whatsapp-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Non-secret: this must match the "Verify token" pasted into the Meta webhook config
      - key: WA_VERIFY_TOKEN
        value: msouwout_webhook_2026
      # Secrets — set in the Render dashboard (Environment tab), not in git:
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
